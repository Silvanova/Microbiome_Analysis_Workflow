on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # --- Add: install R so Quarto can run R code chunks ---
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      # --- Add: install/cached R packages used by your .qmd files ---
      # If you have an renv.lock, this will use it automatically.
      # Otherwise it will look for DESCRIPTION, or you can list packages explicitly.
      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          # Uncomment and list packages if you are NOT using renv/DESCRIPTION:
          packages: |
            any::downloadthis

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
