# ITS version of the website (the one published for the course).
# Render from this folder: quarto render  (output in website-ITS/_site)

project:
  type: website
  render:
    - index.qmd
    - get-started.qmd
    - get-started/**/*.qmd
    - otu-tables.qmd
    - otu-tables/**/*.qmd
    - stats.qmd
    - stats/**/*.qmd

format:
  html:
    theme: minty
    # page descriptions are for search engines only: hide them in the title block
    include-in-header:
      text: "<style>.quarto-title-block .description { display: none; }</style>"
    toc: true
    toc-expand: 4
    toc-depth: 4
    link-external-newwindow: true
    link-external-filter: '^(?:http:|https:)\/\/(?:www\.)*(silvanova\.github\.io)\/.*$'

website:
  title: "Silva Nova MAW"
  description: "Free R tutorial for microbiome and eDNA metabarcoding analysis with phyloseq, using soil fungal ITS data."
  site-url: "https://silvanova.github.io/Microbiome_Analysis_Workflow/"
  open-graph: true
  page-navigation: true
  # bread-crumbs: false
  navbar:
    background: primary
    search: true
    pinned: true
    tools:
      - icon: twitter
        href: https://twitter.com/SilvaNova_NNF
      - icon: github
        href: https://github.com/Silvanova/Microbiome_Analysis_Workflow

# TABS IN NAVIGATION BAR (TOP)

    left:
      - text: "Get started"
        href: get-started.qmd

      - text: "Handling OTU tables"
        href: otu-tables.qmd

      - text: "Statistical Analyses"
        href: stats.qmd

# TABS IN SIDEBAR

  sidebar:
    - title: "Silva Nova MAW"
      style: "docked"
      background: light
      logo: images/Silva Nova MAW logo.png
      collapse-level: 3
      align: left
      contents:
        - file: index.qmd
          text: " "

    - title: "Get started"
      contents:
        - section: "Get started"
          file: get-started.qmd
          contents:
            - text: "Install R and packages"
              file: get-started/install.qmd
            - text: "Data preparation"
              file: get-started/data-prep.qmd
            - text: "Explore the data"
              file: get-started/explore.qmd

    - title: "Handling OTU tables"
      contents:

      - section: "Handling OTU tables"
        file: otu-tables.qmd
        contents:

        - section: "Dealing with controls"
          file: otu-tables/controls.qmd
          contents:
          - text: "Positive controls"
            file: otu-tables/controls-positive.qmd
          - text: "Negative controls"
            file: otu-tables/controls-negative.qmd

        - section: "Filtering OTU tables"
          file: otu-tables/filter.qmd
          contents:
          - text: "Global filtering"
            file: otu-tables/filter/global.qmd
          - text: "BLAST quality check"
            file: otu-tables/filter/BLAST.qmd

        - text: "Rarefaction & Normalization"
          file: otu-tables/rare-norm.qmd


    - title: "Statistical Analyses"
      contents:
        - section: "Statistical Analyses"
          file: stats.qmd
          contents:
          - text: "Alpha diversity"
            file: stats/alpha-div.qmd
          - text: "Taxonomic composition & guilds"
            file: stats/taxa-comp.qmd
          - text: "Beta diversity"
            file: stats/beta-div.qmd
          - text: "Indicator species"
            file: stats/diff-abund.qmd
          - text: "RDA & variation partitioning"
            file: stats/rda.qmd
